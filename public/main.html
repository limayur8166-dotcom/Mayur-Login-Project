<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexus Dashboard</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f7fb;
      min-height:100vh;
    }

    /* HEADER */
    .header{
      width:100%;
      background:#111827;
      color:white;
      padding:18px 30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .header h2{
      font-size:24px;
    }

    .user-box{
      display:flex;
      align-items:center;
      gap:15px;
    }

    .logout-btn{
      background:#ef4444;
      color:white;
      border:none;
      padding:10px 16px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    .logout-btn:hover{
      background:#dc2626;
    }

    /* DASHBOARD */
    .dashboard{
      padding:30px;
      display:grid;
      grid-template-columns:2fr 1fr;
      gap:25px;
    }

    .card{
      background:white;
      border-radius:15px;
      padding:25px;
      box-shadow:0 5px 20px rgba(0,0,0,0.08);
    }

    .card h3{
      margin-bottom:20px;
      color:#111827;
    }

    /* USER INFO */
    .info p{
      margin-bottom:10px;
      font-size:16px;
      color:#374151;
    }

    /* CALENDAR */
    .calendar-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .calendar-header button{
      background:#2563eb;
      color:white;
      border:none;
      padding:8px 14px;
      border-radius:8px;
      cursor:pointer;
    }

    .calendar-grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:10px;
      text-align:center;
    }

    .day-header{
      font-weight:bold;
      color:#2563eb;
    }

    .day{
      background:#f3f4f6;
      padding:12px;
      border-radius:10px;
      cursor:pointer;
      transition:0.2s;
    }

    .day:hover{
      background:#2563eb;
      color:white;
    }

    .today{
      border:2px solid #2563eb;
    }

    /* EVENTS */
    .event-box{
      margin-top:20px;
    }

    .event-item{
      background:#eff6ff;
      padding:10px;
      border-radius:8px;
      margin-bottom:10px;
    }

    textarea{
      width:100%;
      margin-top:15px;
      padding:12px;
      border-radius:10px;
      border:1px solid #d1d5db;
      resize:none;
    }

    .add-btn{
      width:100%;
      margin-top:10px;
      background:#10b981;
      color:white;
      border:none;
      padding:12px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
    }

    .add-btn:hover{
      background:#059669;
    }

    /* CHAT */
    .chat-box{
      position:fixed;
      right:20px;
      bottom:20px;
      width:320px;
      height:420px;
      background:white;
      border-radius:15px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      display:flex;
      flex-direction:column;
    }

    .chat-header{
      background:#2563eb;
      color:white;
      padding:15px;
      font-weight:bold;
    }

    .chat-messages{
      flex:1;
      padding:15px;
      overflow-y:auto;
      font-size:14px;
    }

    .chat-input{
      display:flex;
      border-top:1px solid #ddd;
    }

    .chat-input input{
      flex:1;
      border:none;
      padding:12px;
      outline:none;
    }

    .chat-input button{
      background:#2563eb;
      color:white;
      border:none;
      padding:0 18px;
      cursor:pointer;
    }

    @media(max-width:900px){
      .dashboard{
        grid-template-columns:1fr;
      }

      .chat-box{
        width:95%;
        right:10px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <h2>Nexus Dashboard 🚀</h2>

    <div class="user-box">
      <span id="welcomeUser"></span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard">

    <!-- LEFT -->
    <div class="card">
      <h3>User Information</h3>

      <div class="info">
        <p><b>Username:</b> <span id="userName"></span></p>
        <p><b>Email:</b> <span id="userEmail"></span></p>
      </div>

      <br>

      <!-- CALENDAR -->
      <div class="calendar-header">
        <button onclick="prevMonth()">Prev</button>
        <h3 id="monthYear"></h3>
        <button onclick="nextMonth()">Next</button>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- RIGHT -->
    <div class="card">
      <h3 id="selectedDate">Select a date</h3>

      <div class="event-box" id="eventList"></div>

      <textarea id="eventInput" rows="4" placeholder="Add event..."></textarea>

      <button class="add-btn" onclick="addEvent()">Add Event</button>
    </div>

  </div>

  <!-- CHAT -->
  <div class="chat-box">

    <div class="chat-header">
      🤖 AI Assistant
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="Ask anything...">
      <button onclick="sendChat()">➤</button>
    </div>

  </div>

<script>

  // =========================================
  // IMPORTANT
  // =========================================

  // CHANGE THIS TO YOUR LOAD BALANCER DNS
  // Example:
  // const API_BASE = "http://my-lb-123.ap-south-1.elb.amazonaws.com";

  const API_BASE = "http://YOUR-LOAD-BALANCER-DNS";



  // =========================================
  // AUTH CHECK
  // =========================================

  const token = localStorage.getItem("nexus_token");
  const user = JSON.parse(localStorage.getItem("nexus_user"));

  if(!token || !user){
    alert("Please login first");
    window.location.href = "index.html";
  }

  document.getElementById("welcomeUser").innerText =
    "Welcome " + user.username;

  document.getElementById("userName").innerText =
    user.username;

  document.getElementById("userEmail").innerText =
    user.email;



  // =========================================
  // LOGOUT
  // =========================================

  function logout(){
    localStorage.removeItem("nexus_token");
    localStorage.removeItem("nexus_user");

    window.location.href = "index.html";
  }



  // =========================================
  // CHAT API
  // =========================================

  async function sendChat(){

    const input = document.getElementById("chatInput");
    const msg = input.value.trim();

    if(!msg) return;

    const chat = document.getElementById("chatMessages");

    chat.innerHTML += `
      <div style="margin-bottom:10px;">
        <b>You:</b> ${msg}
      </div>
    `;

    input.value = "";

    try{

      const res = await fetch(`${API_BASE}/api/chat`,{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization":"Bearer " + token
        },
        body:JSON.stringify({
          message:msg
        })
      });

      const data = await res.json();

      chat.innerHTML += `
        <div style="margin-bottom:15px;color:#2563eb;">
          <b>AI:</b> ${data.reply}
        </div>
      `;

      chat.scrollTop = chat.scrollHeight;

    }catch(err){

      chat.innerHTML += `
        <div style="color:red;">
          Server not reachable
        </div>
      `;

    }
  }



  // =========================================
  // CALENDAR
  // =========================================

  const monthYear =
    document.getElementById("monthYear");

  const calendarGrid =
    document.getElementById("calendarGrid");

  const eventList =
    document.getElementById("eventList");

  const eventInput =
    document.getElementById("eventInput");

  const selectedDateEl =
    document.getElementById("selectedDate");

  let today = new Date();

  let currentMonth = today.getMonth();
  let currentYear = today.getFullYear();

  let selectedDate = null;

  const months = [
    "January","February","March",
    "April","May","June",
    "July","August","September",
    "October","November","December"
  ];

  const days = [
    "Sun","Mon","Tue",
    "Wed","Thu","Fri","Sat"
  ];



  function renderCalendar(month, year){

    calendarGrid.innerHTML = "";

    monthYear.innerText =
      `${months[month]} ${year}`;

    // DAY HEADERS
    for(let d of days){

      const head =
        document.createElement("div");

      head.classList.add("day-header");

      head.innerText = d;

      calendarGrid.appendChild(head);
    }

    const firstDay =
      new Date(year, month, 1).getDay();

    const totalDays =
      new Date(year, month + 1, 0).getDate();

    // EMPTY CELLS
    for(let i=0; i<firstDay; i++){

      const empty =
        document.createElement("div");

      calendarGrid.appendChild(empty);
    }

    // DATES
    for(let d=1; d<=totalDays; d++){

      const day =
        document.createElement("div");

      day.classList.add("day");

      day.innerText = d;

      if(
        d === today.getDate() &&
        month === today.getMonth() &&
        year === today.getFullYear()
      ){
        day.classList.add("today");
      }

      day.onclick = () =>
        selectDate(d, month, year);

      calendarGrid.appendChild(day);
    }
  }



  function prevMonth(){

    currentMonth--;

    if(currentMonth < 0){
      currentMonth = 11;
      currentYear--;
    }

    renderCalendar(currentMonth, currentYear);
  }



  function nextMonth(){

    currentMonth++;

    if(currentMonth > 11){
      currentMonth = 0;
      currentYear++;
    }

    renderCalendar(currentMonth, currentYear);
  }



  function selectDate(date, month, year){

    selectedDate =
      `${year}-${month+1}-${date}`;

    selectedDateEl.innerText =
      `Events on ${date} ${months[month]} ${year}`;

    loadEvents();
  }



  function loadEvents(){

    eventList.innerHTML = "";

    const events =
      JSON.parse(
        localStorage.getItem(`${user.username}_events`)
      ) || {};

    if(events[selectedDate]){

      events[selectedDate].forEach(ev => {

        const div =
          document.createElement("div");

        div.classList.add("event-item");

        div.innerText = ev;

        eventList.appendChild(div);

      });
    }
  }



  function addEvent(){

    if(!selectedDate){

      alert("Select a date first");

      return;
    }

    const text =
      eventInput.value.trim();

    if(!text) return;

    let events =
      JSON.parse(
        localStorage.getItem(`${user.username}_events`)
      ) || {};

    if(!events[selectedDate]){
      events[selectedDate] = [];
    }

    events[selectedDate].push(text);

    localStorage.setItem(
      `${user.username}_events`,
      JSON.stringify(events)
    );

    eventInput.value = "";

    loadEvents();
  }



  // START
  renderCalendar(currentMonth, currentYear);

</script>

</body>
</html>
